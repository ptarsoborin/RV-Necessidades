{% extends 'base.html' %}
{% block titulo %}{{ titulo }} · RV Necessidades{% endblock %}
{% block conteudo %}
<h1>{{ titulo }}</h1>
<p class="sub">{{ texto }}</p>
<p><a class="btn sec" href="{{ url_for('paginas.inicio') }}">Voltar ao início</a></p>
{% endblock %}
{% block conteudo_aberto %}

{% endblock %}

{% extends 'base.html' %}
{% block titulo %}Entrar · RV Necessidades{% endblock %}
{% block conteudo_aberto %}
<div class="logo"><img src="{{ url_for('static', filename='logo.png') }}" alt="Autopel soluções"></div>
<div class="card">
  <h2>Entrar no RV Necessidades</h2>
  <form method="post" autocomplete="on">
    <input type="hidden" name="csrf" value="{{ csrf() }}">
    <input type="hidden" name="proximo" value="{{ proximo }}">
    <label for="login">Usuário</label>
    <input type="text" id="login" name="login" autocomplete="username" autofocus required>
    <label for="senha">Senha</label>
    <input type="password" id="senha" name="senha" autocomplete="current-password" required>
    <p><button class="btn" type="submit">Entrar</button></p>
  </form>
  <p class="nota">Esqueceu a senha? Peça ao admin para gerar uma nova.</p>
</div>
{% endblock %}
